apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  namespace: user-domain
spec:
  replicas: 1
  selector:
    matchLabels:
      app: user-service
  template:
    metadata:
      labels:
        app: user-service
    spec:
      initContainers:
        - name: wait-for-db
          image: busybox
          command:
            - sh
            - -c
            - "until nc -z user-db-0.user-db 5432; do echo 'nothing ever happens(db)'; sleep 2; done"
      containers:
        - name: user-service
          image: ghcr.io/egot3/supel/backend/user:latest
          resources:
            requests:
              memory: "128Mi"
              cpu: "500m"
            limits:
              memory: "256Mi"
              cpu: "1000m"
          env:
            - name: DB_HOST
              valueFrom:
                secretKeyRef:
                  name: user-db-secret
                  key: DB_HOST
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: user-db-secret
                  key: POSTGRES_PASSWORD
            - name: DB_PORT
              valueFrom:
                secretKeyRef:
                  name: user-db-secret
                  key: DB_PORT
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: user-db-secret
                  key: DB_USER
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: user-db-secret
                  key: JWT_SECRET
            - name: STORAGE_HOST
              value: minio.storage-domain.svc.cluster.local
            - name: STORAGE_PORT
              value: "9000"
            - name: STORAGE_ACCESS_KEY
              value: minioadmin
            - name: STORAGE_SECRET_KEY
              value: minioadmin
            - name: STORAGE_USER_BUCKET
              value: user
          readinessProbe:
            grpc:
              port: 50051
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: user-service
  namespace: user-domain
spec:
  selector:
    app: user-service
  ports:
    - port: 50051
      targetPort: 50051
