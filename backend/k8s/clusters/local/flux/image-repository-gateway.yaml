apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: gateway
  namespace: flux-system
spec:
  image: ghcr.io/egot3/supel/backend/gateway
  interval: 1m

---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: gateway
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: gateway
  policy:
    semver:
      range: ">=0.0.1"
