apiVersion: apps/v1
kind: Deployment
metadata:
  name: traefik
  namespace: traefik
  labels:
    app: traefik
spec:
  replicas: 1
  selector:
    matchLabels:
      app: traefik
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: traefik
    spec:
      serviceAccountName: traefik

      terminationGracePeriodSeconds: 60

      containers:
        - name: traefik
          image: traefik:v3.3
          args:
            - --configFile=/config/traefik.yaml
            - --providers.kubernetescrd.namespaces=
          ports:
            - name: web
              containerPort: 80
            - name: websecure
              containerPort: 443
            - name: traefik
              containerPort: 8080

          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true

          readinessProbe:
            httpGet:
              path: /ping
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /ping
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
            failureThreshold: 5

          securityContext:
            capabilities:
              add: [NET_BIND_SERVICE]
            readOnlyRootFilesystem: true
            runAsNonRoot: false

          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi

      volumes:
        - name: config
          configMap:
            name: traefik-config
