apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-config
  namespace: monitoring
data:
  loki.yaml: |
    auth_enabled: false

    server: 
      http_listen_port: 3100
      grpc_listen_port: 9096
      log_level: debug

    common:
      ring:
        instance_addr: 127.0.0.1
        kvstore:
          store: inmemory
      replication_factor: 1
      path_prefix: /loki

    schema_config:
      configs:
        - from: 2026-01-01
          store: tsdb
          object_store: filesystem
          schema: v13
          index: 
            prefix: index_
            period: 24h
      
      storage_config:
        tsdb_shipper:
          active_index_directory: /loki/tsdb-index
          cache_location: /loki/tsdb-cache
        filesystem:
          directory: /loki/chunks

      limits_configs:
        allow_structured_metadata: true
        volume_enabled: true
