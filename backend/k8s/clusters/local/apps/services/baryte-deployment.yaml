apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-service
  namespace: gateway-domain
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "6767"
    prometheus.io/path: "/metrics"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway-service
  template:
    metadata:
      labels:
        app: gateway-service
    spec:
      containers:
        - name: gateway-service
          image: ghcr.io/egot3/supel/backend/gateway:v0.0.2 # {"$imagepolicy": "flux-system:gateway"}
          resources:
            requests:
              memory: "32Mi"
              cpu: "100m"
            limits:
              memory: "32Mi"
              cpu: "500m"
          env:
            - name: ENV
              value: development
            - name: IDENTITY_SERVICE_HOST
              value: identity-service.identity-domain.svc.cluster.local
            - name: IDENTITY_SERVICE_PORT
              value: "50051"
            - name: NEWS_SERVICE_HOST
              value: news-service.news-domain.svc.cluster.local
            - name: NEWS_SERVICE_PORT
              value: "50051"
            - name: USER_SERVICE_HOST
              value: user-service.user-domain.svc.cluster.local
            - name: USER_SERVICE_PORT
              value: "50051"
            - name: TIMETABLE_SERVICE_HOST
              value: timetable-service.timetable-domain.svc.cluster.local
            - name: TIMETABLE_SERVICE_PORT
              value: "50051"
            - name: RBAC_SERVICE_HOST
              value: rbac-service.rbac-domain.svc.cluster.local
            - name: RBAC_SERVICE_PORT
              value: "50051"
---
apiVersion: v1
kind: Service
metadata:
  name: gateway-service
  namespace: gateway-domain
spec:
  selector:
    app: gateway-service
  ports:
    - port: 51000
      targetPort: 51000
