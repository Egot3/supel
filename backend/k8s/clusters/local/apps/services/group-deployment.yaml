apiVersion: apps/v1
kind: Deployment
metadata:
  name: group-service
  namespace: group-domain
spec:
  replicas: 1
  selector:
    matchLabels:
      app: group-service
  template:
    metadata:
      labels:
        app: group-service
    spec:
      containers:
        - name: group-service
          image: ghcr.io/egot3/supel/backend/group:latest
          resources:
            requests:
              memory: "128Mi"
              cpu: "500m"
            limits:
              memory: "256Mi"
              cpu: "1000m"
          env:
            - name: DB_HOST
              valueFrom:
                secretKeyRef:
                  name: group-db-secret
                  key: DB_HOST
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: group-db-secret
                  key: POSTGRES_PASSWORD
            - name: DB_PORT
              valueFrom:
                secretKeyRef:
                  name: group-db-secret
                  key: DB_PORT
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: group-db-secret
                  key: DB_USER
            - name: IDENTITY_SERVICE_HOST
              value: identity-service.identity-domain.svc.cluster.local
            - name: IDENTITY_SERVICE_PORT
              value: "50051"
            - name: USER_SERVICE_HOST
              value: user-service.user-domain.svc.cluster.local
            - name: USER_SERVICE_PORT
              value: "50051"
            - name: RBAC_SERVICE_HOST
              value: rbac-service.rbac-domain.svc.cluster.local
            - name: RBAC_SERVICE_PORT
              value: "50051"
          readinessProbe:
            grpc:
              port: 50051
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: group-service
  namespace: group-domain
spec:
  selector:
    app: group-service
  ports:
    - port: 50051
      targetPort: 50051
