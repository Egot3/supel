apiVersion: apps/v1
kind: Deployment
metadata:
  name: identity-service
  namespace: identity-domain
spec:
  replicas: 1
  selector:
    matchLabels:
      app: identity-service
  template:
    metadata:
      labels:
        app: identity-service
    spec:
      initContainers:
        - name: wait-for-db
          image: busybox
          command:
            - sh
            - -c
            - "until nc -z identity-db-0.identity-db 5432; do echo 'nothing ever happens(db)'; sleep 2; done"
      containers:
        - name: identity-service
          image: ghcr.io/egot3/supel/backend/identity:latest
          resources:
            requests:
              memory: "128Mi"
              cpu: "500m"
            limits:
              memory: "256Mi"
              cpu: "1000m"
          env:
            - name: DB_HOST
              valueFrom:
                secretKeyRef:
                  name: identity-db-secret
                  key: DB_HOST
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: identity-db-secret
                  key: POSTGRES_PASSWORD
            - name: DB_PORT
              valueFrom:
                secretKeyRef:
                  name: identity-db-secret
                  key: DB_PORT
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: identity-db-secret
                  key: DB_USER
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: identity-db-secret
                  key: JWT_SECRET
          readinessProbe:
            grpc:
              port: 50051
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: identity-service
  namespace: identity-domain
spec:
  selector:
    app: identity-service
  ports:
    - name: grpc-port
      port: 50051
      targetPort: 50051
    - name: http-port
      port: 9030
      targetPort: 9030
