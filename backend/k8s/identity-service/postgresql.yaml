apiVersion: v1
kind: Secret
metadata:
  name: identity-db-secret
  namespace: identity-domain
type: Opaque
stringData:
  JWT_SECRET: a-string-secret-at-least-256-bits-long
  DB_USER: ETS
  DB_PASSWORD: super_SECURE-pAsSwOrD2805!!!
  DB_HOST: postgres
  DB_PORT: "30211"
  DB_NAME: identity_db

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: identity-db
  namespace: identity-domain
spec:
  serviceName: identity-db
  replicas: 1
  selector:
    matchLabels:
      app: identity-db
  template:
    metadata:
      labels:
        app: identity-db
      spec:
      containers:
        - name: postgres
          image: postgres:16
          envFrom:
            - secretRef:
                name: identity-db-secret
              ports:
                - containerPort: 5432
              volumeMounts:
                - name: identity-db-data
                  mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: identity-db-data
      spec:
        accessModes: ["ReadWriteOnce"]
        recources:
          requests:
            storage: 512Mi

---
apiVersion: v1
kind: Service
metadata:
  name: identity-db
  namespace: identity-domain
spec:
  clusterIP: None
  selector:
    app: identity-db
  ports:
    - port: 30211
