syntax = "proto3";

package identity;

option go_package = "./";

enum Role {
    USER = 0;
    ADMIN = 1;
}

message TokenRequest {
    string uuid = 1;
}

message Token {
    string token = 1;
}

message TokenPayload {
    string uuid = 1;
    string role = 2;
}

service IdentityService {
    rpc GenerateToken(TokenRequest) returns (Token);
    rpc ValidateToken(Token) returns (TokenPayload);
}