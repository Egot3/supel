name: Build&Push to GHCR

on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.set-apps.outputs.apps }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find dockerfiles
        id: set-apps
        run: |
          apps=$(find . -maxdepth 4 -iname dockerfile -printf '%h\n' \
            | sed 's|^./||' \
            | sort \
            | jq -R -s -c 'split("\n") | map(select(. != ""))')
          echo "apps=$apps" >> $GITHUB_OUTPUT

  build:
    needs: discover
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.discover.outputs.apps) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase repo
        id: repo
        run: echo "REPO=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: |
            ghcr.io/${{ steps.repo.outputs.REPO }}/${{ matrix.app }}
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}

      - uses: docker/setup-buildx-action@v3
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ./${{ matrix.app }}
          file: ./${{ matrix.app }}/dockerfile
          push: true

          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

          cache-from: type=registry,ref=ghcr.io/${{ steps.repo.outputs.REPO }}/cache/${{ matrix.app }}:buildcache-${{ github.ref_name }}
          cache-to: type=registry,ref=ghcr.io/${{ steps.repo.outputs.REPO }}/cache/${{ matrix.app }}:buildcache-${{ github.ref_name }},mode=max
